name: Daily Data Collection

on:
  schedule:
    # 每週一到週五 21:30 台灣時間執行 (UTC+8 = 13:30 UTC)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '收集日期 (YYYY-MM-DD，留空為當天)'
        required: false
        type: string
      types:
        description: '資料類型 (用空格分隔，如: price institutional)'
        required: false
        default: 'price institutional margin lending top20_volume'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  collect:
    name: Collect Daily Data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false  # 不下載歷史資料，只寫入新資料

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set collection parameters
        id: params
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
            DATE_ARG="--date ${{ github.event.inputs.date }}"
            COMMIT_DATE="${{ github.event.inputs.date }}"
          else
            # 不指定日期，讓程式使用當天日期
            DATE_ARG=""
            COMMIT_DATE=$(date +%Y-%m-%d)
          fi

          echo "date_arg=${DATE_ARG}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT

          if [ -n "${{ github.event.inputs.types }}" ]; then
            echo "types=${{ github.event.inputs.types }}" >> $GITHUB_OUTPUT
          else
            echo "types=price institutional margin lending top20_volume" >> $GITHUB_OUTPUT
          fi

      - name: Pull Data Collector image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/data-collector:latest

      - name: Run data collection
        run: |
          docker run --rm \
            -e TZ=Asia/Taipei \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e LOG_LEVEL=INFO \
            -v ${{ github.workspace }}/data:/app/data \
            -v ${{ github.workspace }}/logs:/app/logs \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/data-collector:latest \
            ${{ steps.params.outputs.date_arg }} \
            --types ${{ steps.params.outputs.types }}

      - name: Check collected data
        run: |
          echo "=== 收集的資料 ==="
          find data/raw -type f -name "*.json" -o -name "*.csv" | head -20

          echo ""
          echo "=== 資料統計 ==="
          echo "JSON 檔案數: $(find data/raw -type f -name "*.json" | wc -l)"
          echo "CSV 檔案數: $(find data/raw -type f -name "*.csv" | wc -l)"
          echo "總大小: $(du -sh data/raw | cut -f1)"

      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/raw/

          # 檢查是否有變更
          if git diff --staged --quiet; then
            echo "沒有新資料需要提交"
          else
            git commit -m "data: Daily collection for ${{ steps.params.outputs.commit_date }}" \
                       -m "Collected data types: ${{ steps.params.outputs.types }}" \
                       -m "🤖 Automated collection by GitHub Actions"

            git push
            echo "✅ 資料已提交到 Git"
          fi

      - name: Upload collection logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-logs-${{ steps.params.outputs.commit_date }}
          path: logs/
          retention-days: 30

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Daily Collection Failed - ${{ steps.params.outputs.commit_date }}',
              body: `## Collection Failed

              **Date:** ${{ steps.params.outputs.commit_date }}
              **Types:** ${{ steps.params.outputs.types }}
              **Workflow:** [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

              Please check the workflow logs for details.`,
              labels: ['automated', 'data-collection', 'bug']
            })
