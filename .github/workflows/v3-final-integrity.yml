name: V3 Final Integrity Audit

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/v3_final_integrity_check.py'
      - '.github/workflows/v3-final-integrity.yml'
  workflow_dispatch:

jobs:
  audit:
    name: Audit V3 backtest dataset
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run final integrity audit
        id: audit
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/v3_final_integrity_check.py

      - name: Commit audit reports
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f data/v3_integrity_report_20260401_20261002.json
          git add -f data/v3_integrity_report_20260401_20261002.md
          if git diff --staged --quiet; then
            echo "No audit report changes to commit"
          else
            git commit -m "data: add V3 final integrity audit"
            git push
          fi

      - name: Enforce audit result
        if: always()
        run: |
          if [ "${{ steps.audit.outcome }}" != "success" ]; then
            echo "V3 integrity audit reported critical findings."
            exit 1
          fi
          echo "V3 integrity audit passed."
